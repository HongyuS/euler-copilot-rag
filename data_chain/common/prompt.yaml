    注意：
    #01 陈述必须来源于答案中的重点内容
    #02 陈述按相对顺序排列
    #03 输出的单个陈述长度不超过50个字
    #04 输出的陈述总数不超过20个
    #05 请仅输出中文陈述列表，不要输出其他内容
    
