[pytest]
# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = .

# 标记定义
markers =
    slow: 慢测试（性能测试等需要较长时间的测试）
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    accuracy: 准确率测试
    stability: 稳定性测试

# 异步模式
asyncio_mode = auto

# 默认选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤器
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
