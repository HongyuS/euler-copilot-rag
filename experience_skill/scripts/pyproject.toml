[project]
name = "experience-skill-cli"
version = "0.1.0"
description = "经验管理与文档解析 CLI 工具（含 Web 前端）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.21.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
experience-skill = "main:main"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
