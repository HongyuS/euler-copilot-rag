keywords_regex_and_scores:
  normal:
    'Kdump:': 2.0  # Kdump标识头（最高权重）
    'vmcore': 1.9  # 崩溃内存镜像文件
    'crash>': 1.8  # crash工具交互提示符
    'kdump': 1.5  # kdump关键字
    'core dump': 1.4  # 核心转储通用标识

  anomalous:
    'PANIC: ': 1.8  # 内核panic标识
    'Vmlinux Path:': 1.7  # 内核镜像路径
    'bt\\s+#\\d+': 1.7  # crash工具回溯命令输出
    'PID: \\d+ \\(comm: \\w+\\)': 1.7  # 崩溃进程信息
    'RIP: |RSP: |RAX: ': 1.6  # x86寄存器信息
    'Segmentation fault': 1.6  # 段错误
    'Kernel panic - not syncing:': 1.6  # 内核panic详情

mandatory:
  # Kdump核心回溯头
  'crash> bt':
    - '#\\d+\\s+[0-9a-fx]+\\s+'  # 栈帧编号+地址
    - 'in \\w+ at .+:\\d+'  # 函数+文件行号
    - '^\\s+'  # 缩进的栈帧行
    - 'RIP: [0-9a-fx]+'  # 指令指针
    - 'RSP: [0-9a-fx]+'  # 栈指针

  # PANIC崩溃头
  'PANIC: .+':
    - 'CPU: \\d+ PID: \\d+'  # CPU/PID信息
    - 'Call Trace:'  # 调用栈
    - 'kernel \\[\\#\\d+\\]'  # 内核版本
    - '^\\s+'  # 缩进行

  vmcore:
    - 'ELF64|ELF32'  # 核心文件格式
    - 'x86_64|arm64|aarch64'  # 架构信息
    - 'crash tool'  # crash工具标识
    - 'gdb:'  # gdb调试标识

capture_patterns:
  # 新增毫秒/时间戳
  timestamp: "\\b(?:\\d{4}-\\d{2}-\\d{2}\\s\\d{2}:\\d{2}:\\d{2}\\.\\d+|\\[\\s*\\d+\\.\\d+\\]|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}|\\d{10,13})\\b"
  # 新增crash/fault
  level: "\\b(?:emerg|alert|crit|err|FATAL|PANIC|panic|DEBUG|INFO|WARNING|ERROR|CRITICAL|UNKNOWN|crash|fault|fatal)\\b"
  ip: "\\b(?:(?:25\\[0-5\\]|2\\[0-4\\]\\d|\\[01\\]?\\d\\d?)\\.){3}(?:25\\[0-5\\]|2\\[0-4\\]\\d|\\[01\\]?\\d\\d?)(?::\\d{1,5})?(?:\\/\\d{1,2})?\\b"