# RAG服务私有配置
port = 12311

# Token相关配置
[token]
model = "gpt-4"
max_tokens = 8192
default_chunk_size = 1024

# 检索配置
[search]
default_top_k = 5
max_top_k = 100

# GitHub线上检索配置
[github]
enabled = true
token = "REDACTED"
issue_repos = ["raspberrypi/linux", "microsoft/WSL2-Linux-Kernel"]
commit_repo = "torvalds/linux"
default_online_top_k = 2
max_candidates = 20
request_timeout = 10
rate_limit_delay = 1
