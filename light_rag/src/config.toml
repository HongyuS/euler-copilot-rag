# RAG MCP 本地配置
language = "zh"

# 任务配置（独立 task.db）
[task]
db_path = "database/task.db"
cpu_use_limit = 4

# Token相关配置
[token]
model = "gpt-4"
max_tokens = 8192
default_chunk_size = 1024

# 检索配置
[search]
default_top_k = 5
max_top_k = 100

# GitHub线上检索配置
[github]
enabled = false
token = ""
issue_repos = [
  "torvalds/linux",
  "moby/moby",
  "containerd/containerd",
  "systemd/systemd",
  "kubernetes/kubernetes",
  "etcd-io/etcd",
  "opencontainers/runc",
  "cri-o/cri-o"
]
commit_repos = [
  "torvalds/linux",
  "moby/moby",
  "containerd/containerd",
  "systemd/systemd",
  "kubernetes/kubernetes",
  "etcd-io/etcd",
  "opencontainers/runc",
  "cri-o/cri-o"
]
default_online_top_k = 5
max_candidates = 20
request_timeout = 10
rate_limit_delay = 1
commit_vector_db_path = "database/commit_vec.db"
commit_local_min_hits = 3
commit_local_min_similarity = 0.45

# 向量化服务配置
[embedding]
type = "openai"
api_key = ""
endpoint = ""
model_name = "text-embedding-v4"
timeout = 30
vector_dimension = 1024
embedding_batch_size = 8
