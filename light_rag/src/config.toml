# RAG MCP 本地配置
language = "zh"

# Token相关配置
[token]
model = "gpt-4"
max_tokens = 8192
default_chunk_size = 1024

# 检索配置
[search]
default_top_k = 5
max_top_k = 100

# GitHub线上检索配置
[github]
enabled = false
token = ""
issue_repos = ["raspberrypi/linux", "microsoft/WSL2-Linux-Kernel"]
commit_repo = "torvalds/linux"
default_online_top_k = 5
max_candidates = 20
request_timeout = 10
rate_limit_delay = 1

# 向量化服务配置
[embedding]
type = "openai"
api_key = ""
endpoint = ""
model_name = "text-embedding-ada-002"
timeout = 30
vector_dimension = 1024
