tools:
  Knowledge_base_manager:
    zh: |
      知识库管理器，支持创建和列出知识库。通过 action 参数控制具体操作。
      
      参数说明：
      - action：操作类型（必填），"add" 表示创建知识库，"list" 表示列出知识库
      - kb_name：知识库名称（创建时必填，必须唯一）
      - chunk_size：chunk大小，单位token（创建时必填，例如512、1024）
      - embedding_model：向量化模型名称（创建时可选，例如text-embedding-ada-002）
      - embedding_endpoint：向量化服务端点URL（创建时可选）
      - embedding_api_key：向量化服务API Key（创建时可选）
      - keyword：关键词（列出时可选），用于模糊查询知识库名称
      
      返回值：
      - 当 action="add" 时，返回创建结果：
        - success：布尔值，表示是否成功
        - message：字符串，描述操作结果
        - data：字典，包含创建结果（kb_id、kb_name、chunk_size）
      - 当 action="list" 时，返回知识库列表：
        - success：布尔值，表示是否成功
        - message：字符串，描述操作结果
        - data：字典，包含知识库列表（knowledge_bases、count、keyword）
    en: |
      Knowledge base manager, supports creating and listing knowledge bases. Use action parameter to control the specific operation.
      
      Parameters:
      - action: Operation type (required), "add" for creating knowledge base, "list" for listing knowledge bases
      - kb_name: Knowledge base name (required when creating, must be unique)
      - chunk_size: Chunk size in tokens (required when creating, e.g., 512, 1024)
      - embedding_model: Embedding model name (optional when creating, e.g., text-embedding-ada-002)
      - embedding_endpoint: Embedding service endpoint URL (optional when creating)
      - embedding_api_key: Embedding service API Key (optional when creating)
      - keyword: Keyword (optional when listing), used for fuzzy search of knowledge base names
      
      Return value:
      - When action="add", returns creation result:
        - success: Boolean, indicating whether the operation was successful
        - message: String, describing the operation result
        - data: Dictionary containing creation results (kb_id, kb_name, chunk_size)
      - When action="list", returns knowledge base list:
        - success: Boolean, indicating whether the operation was successful
        - message: String, describing the operation result
        - data: Dictionary containing knowledge base list (knowledge_bases, count, keyword)
  document_manager:
    zh: |
      文档管理器，支持导入文档和获取文档解析结果。通过 action 参数控制具体操作。
      
      参数说明：
      - action：操作类型（必填），"add" 表示导入文档，"getchunks" 表示获取文档解析结果
      - file_paths：文件路径列表（绝对路径），导入时必填，支持1~n个文件
      - kb_name：知识库名称（必填）
      - chunk_size：chunk大小，单位token（导入时可选，默认使用知识库的chunk_size）
      - doc_name：文档名称（获取解析结果时必填）
      
      返回值：
      - 当 action="add" 时，返回导入结果：
        - success：布尔值，表示是否成功（只要有文件成功导入即为true）
        - message：字符串，描述操作结果（包含成功和失败的数量）
        - data：字典，包含导入结果（total、success_count、failed_count、success_files、failed_files）
      - 当 action="getchunks" 时，返回文档解析结果：
        - success：布尔值，表示是否成功
        - message：字符串，描述操作结果
        - data：字典，包含文档解析结果（doc_id、doc_name、kb_name、chunks、count）
    en: |
      Document manager, supports importing documents and getting document parsing results. Use action parameter to control the specific operation.
      
      Parameters:
      - action: Operation type (required), "add" for importing documents, "getchunks" for getting document parsing results
      - file_paths: List of file paths (absolute paths), required when importing, supports 1~n files
      - kb_name: Knowledge base name (required)
      - chunk_size: Chunk size in tokens (optional when importing, defaults to knowledge base's chunk_size)
      - doc_name: Document name (required when getting parsing results)
      
      Return value:
      - When action="add", returns import result:
        - success: Boolean, indicating whether the operation was successful (true if any file was successfully imported)
        - message: String, describing the operation result (includes counts of successful and failed imports)
        - data: Dictionary containing import results (total, success_count, failed_count, success_files, failed_files)
      - When action="getchunks", returns document parsing results:
        - success: Boolean, indicating whether the operation was successful
        - message: String, describing the operation result
        - data: Dictionary containing document parsing results (doc_id, doc_name, kb_name, chunks, count)
  search:
    zh: |
      在指定知识库列表中进行混合检索。结合关键词检索（FTS5）和向量检索（sqlite-vec），使用加权方式合并结果，去重后使用Jaccard相似度重排序，返回最相关的top-k个结果。可以在多个知识库中同时搜索。
      
      参数说明：
      - query：查询文本（必填，通常由用户提供）
      - kb_names：知识库名称列表（必填），可以传入一个或多个知识库名称。如果用户未提供，则由大模型根据查询内容和上下文推断合适的知识库，或询问用户。可以通过 list_knowledge_bases 查看所有可用的知识库。如果用户未指定，大模型可以搜索所有知识库或根据查询主题选择最相关的知识库。
      - top_k：返回数量（可选，默认从配置读取，通常为5）。如果用户未提供，大模型可以使用默认值，或根据查询的复杂程度和用户需求自行推断合适的数量。
      - keyword_weight：关键词搜索权重（可选，默认0.3，范围0-1）。向量权重自动为 1 - keyword_weight。如果用户未提供，大模型应根据查询特点自行推断合适的权重值。
        调整策略：
        - 如果查询包含较多具体关键词、专业术语或需要精确匹配，建议提高 keyword_weight（如0.5-0.7）
        - 如果查询更偏向语义理解、概念匹配或需要理解意图，建议降低 keyword_weight（如0.1-0.3）
        - 可以根据返回结果的相关性动态调整：如果结果不够相关，可以尝试调整权重后重新搜索
      - banned_chunk_ids：被禁用的chunk ID列表（可选，可以为空列表）。用于过滤掉已经被标记为效果不好的chunk。典型使用场景：
        - 第一次搜索得到了几个chunk答案，但感觉效果不好
        - 大模型修改权重或修改查询后再次搜索，此时应该把那几个效果不好的chunk ID加入到 banned_chunk_ids 中
        - 第二次搜索的结果就不会包含这些被禁用的chunk
        - 大模型应该从多次的搜索结果综合给出最终答案
      - online：是否启用GitHub线上检索（可选，默认False）。如果为True，会在GitHub上搜索相关的Issues和Commits，使用向量相似度进行精排，返回最相关的top-k个结果。需要确保GitHub配置已启用且Token已配置。
      - online_top_k：GitHub检索的返回数量（可选，默认从配置读取，通常为2或5）。仅在online=true时生效。
      
      使用建议：
      - 如果第一次搜索结果不理想，可以调整 keyword_weight 并设置 banned_chunk_ids 排除不想要的chunk，然后再次搜索
      - 如果没有检索到相关内容，可以尝试扩展或修改 query 再次查询。例如：将查询改写为更具体或更通用的表述，增加同义词，或者将问题拆分
      - 如果需要查找GitHub上的相关Issues或Commits，可以设置online=true启用线上检索
      
      返回值：
      - success：布尔值，表示是否成功
      - message：字符串，描述检索结果
      - data：字典，包含检索结果
        - chunks：chunk列表，每个chunk包含：
          - id：chunk ID（可用于后续搜索时排除）
          - doc_id：文档ID
          - content：chunk内容
          - tokens：token数量
          - chunk_index：chunk索引
          - doc_name：文档名称
          - score：综合检索分数
        - count：结果数量
        - github_results：GitHub线上检索结果（仅当online=true时返回），包含：
          - issues：GitHub Issue列表，每个Issue包含repo、title、content、similarity
          - commits：GitHub Commit列表，每个Commit包含summary、content、similarity
          - success：GitHub检索是否成功
          - error_message：如果失败，错误信息
    en: |
      Perform hybrid search in the specified knowledge base list. Combines keyword search (FTS5) and vector search (sqlite-vec), merges results using weighted approach, deduplicates, reranks using Jaccard similarity, and returns the top-k most relevant results. Can search across multiple knowledge bases simultaneously.
      
      Parameters:
      - query: Query text (required, usually provided by user)
      - kb_names: List of knowledge base names (required), can pass one or more knowledge base names. If user does not provide, the model should infer appropriate knowledge bases based on query content and context, or ask the user. Can use list_knowledge_bases to view all available knowledge bases. If user does not specify, the model can search all knowledge bases or select the most relevant ones based on query topic.
      - top_k: Number of results to return (optional, default from config, usually 5). If user does not provide, the model can use the default value or infer an appropriate number based on query complexity and user needs.
      - keyword_weight: Keyword search weight (optional, default 0.3, range 0-1). Vector weight is automatically 1 - keyword_weight. If user does not provide, the model should infer an appropriate weight value based on query characteristics.
        Adjustment strategy:
        - If the query contains many specific keywords, technical terms, or requires exact matching, increase keyword_weight (e.g., 0.5-0.7)
        - If the query is more semantic, conceptual, or requires understanding intent, decrease keyword_weight (e.g., 0.1-0.3)
        - Can dynamically adjust based on result relevance: if results are not relevant enough, try adjusting the weight and search again
      - banned_chunk_ids: List of banned chunk IDs (optional, can be empty list). Used to filter out chunks that have been marked as ineffective. Typical usage scenario:
        - First search returns several chunk answers, but they are not satisfactory
        - The model modifies the weight or query and searches again, adding the ineffective chunk IDs to banned_chunk_ids
        - The second search results will not include these banned chunks
        - The model should synthesize the final answer from multiple search results
      - online: Whether to enable GitHub online search (optional, default False). If True, searches for related Issues and Commits on GitHub, uses vector similarity for reranking, and returns the top-k most relevant results. Requires GitHub configuration to be enabled and Token to be configured.
      - online_top_k: Number of GitHub search results to return (optional, default from config, usually 2 or 5). Only effective when online=true.
      
      Usage suggestions:
      - If the first search results are not ideal, you can adjust keyword_weight and set banned_chunk_ids to exclude unwanted chunks, then search again
      - If no relevant content is retrieved, try expanding or modifying the query and search again. For example: rewrite the query to be more specific or general, add synonyms, or split the question
      - If you need to find related Issues or Commits on GitHub, set online=true to enable online search
      
      Return value:
      - success: Boolean, indicating whether the search was successful
      - message: String, describing the search result
      - data: Dictionary containing search results
        - chunks: List of chunks, each containing:
          - id: Chunk ID (can be used to exclude in subsequent searches)
          - doc_id: Document ID
          - content: Chunk content
          - tokens: Number of tokens
          - chunk_index: Chunk index
          - doc_name: Document name
          - score: Combined search score
        - count: Number of results
        - github_results: GitHub online search results (only returned when online=true), containing:
          - issues: List of GitHub Issues, each containing repo, title, content, similarity
          - commits: List of GitHub Commits, each containing summary, content, similarity
          - success: Whether GitHub search was successful
          - error_message: Error message if failed